# News items, shown on the homepage (latest 7), on /news/ (all, by year) and in
# the RSS feed at /news/index.xml. Add new items at the top.
#
#   date: 'YYYY-MM-DD' for new items. Pages show only the month; the RSS feed
#         uses the day. Older items whose day is unknown use 'YYYY-MM', which
#         counts as the first of the month. Items with the same date keep their
#         order in this file.
#   text: one Markdown paragraph. Link papers as /publication/<pub-dir>/; the
#         RSS item links to the first link in the text.

- date: '2026-09-24'
  text: >-
    Our paper, [Uncovering and Shaping the Latent Representation of 3D Scene Topology in
    Vision-Language Models](/publication/2026-vlm-latent-shaping/), has been accepted to
    **NeurIPS 2026** as a **spotlight presentation**.

- date: '2026-08-15'
  text: >-
    Our paper, [SpatialMind: Spatially Aware On-Device Embodied AI via Viewpoint
    Integration](/publication/2026-spatialmind/), has been accepted for publication at the ACM
    International Conference on Mobile Computing and Networking (MobiCom 2026).

- date: '2026-06-17'
  text: >-
    Our paper, [Reasoning Path and Latent State Analysis for Multi-view Visual Spatial
    Reasoning: A Cognitive Science Perspective](/publication/2025-remindview-bench/), has been
    accepted for publication at the European Conference on Computer Vision (ECCV 2026).

- date: '2026-05'
  text: >-
    Our paper, [Attribution-based Sparse Activation in Large Language
    Models](/publication/2026-sparse-activation-slm/), has been accepted for publication at the
    Ninth Conference on Machine Learning and Systems (MLSys 2026).

- date: '2026-03'
  text: >-
    Our paper, [InfiniBench: Infinite Benchmarking for Visual Spatial Reasoning with
    Customizable Scene Complexity](/publication/2025-infinibench/), has been accepted to **CVPR
    2026** as an **oral presentation**.

- date: '2025-12'
  text: >-
    Three of our recent papers, [InfiniBench: Infinite Benchmarking for Visual Spatial Reasoning
    with Customizable Scene Complexity](/publication/2025-infinibench/), [Reasoning Path and
    Latent State Analysis for Multi-view Visual Spatial Reasoning: A Cognitive Science
    Perspective](/publication/2025-remindview-bench/), and [Spatial Reasoning in Multimodal
    Large Language Models: A Survey of Tasks, Benchmarks and
    Methods](/publication/2025-spatial-reasoning-survey/), are now available on arXiv.

- date: '2025-11-08'
  text: >-
    Our paper, [MMBERT: Scaled Mixture-of-Experts Multimodal BERT for Robust Chinese Hate Speech
    Detection under Cloaking Perturbations](/publication/2025-mmbert/), has been accepted for
    publication at the 40th Annual AAAI Conference on Artificial Intelligence (AAAI 2026).

- date: '2025-07'
  text: >-
    Our paper, [ProGait: A Multi-Purpose Video Dataset and Benchmark for Transfemoral Prosthesis
    Users](/publication/2025-progait/), has been accepted for publication at 2025 International
    Conference on Computer Vision (ICCV 2025).

- date: '2025-06'
  text: >-
    Our paper, [Data Can Speak for Itself: Quality-guided Utilization of Wireless Synthetic
    Data](/publication/2025-syncheck/), has been accepted for publication at the ACM
    International Conference on Mobile Systems, Applications, and Services (MobiSys 2025) with
    the **best paper award!**

- date: '2025-06'
  text: >-
    Our paper, [Never Start from Scratch: Expediting On-Device LLM Personalization via
    Explainable Model Selection](/publication/2025-xpert/), has been accepted for publication at
    the ACM International Conference on Mobile Systems, Applications, and Services (MobiSys
    2025).

- date: '2025-04'
  text: >-
    Our paper, [PhyT2V: LLM-Guided Iterative Self-Refinement for Physics-Grounded Text-to-Video
    Generation](/publication/2024-phyt2v/), has been accepted for publication at the Conference
    on Computer Vision and Pattern Recognition 2025 (CVPR 2025).

- date: '2024-12'
  text: >-
    Our paper, [Tackling Intertwined Data and Device Heterogeneities in Federated Learning with
    Unlimited Staleness](/publication/2023-intertwined-heterogeneity/), has been accepted for
    publication at the 39th Annual Conference on Artificial Intelligence (AAAI 2025).

- date: '2024-12'
  text: >-
    Two of our papers, [When Device Delays Meet Data Heterogeneity in Federated AIoT
    Applications](/publication/2025-aiot/) and [Modality Plug-and-Play: Runtime Modality
    Adaptation in LLM-Driven Autonomous mobile Systems](/publication/2023-mpnp-llm/), have been
    accepted for publication at the 2025 ACM International Conference on Mobile Computing and
    Networking (MobiCom'25).

- date: '2024-11'
  text: >-
    The preprint of our recent work on inference-time text-to-video (T2V) generation refinement,
    [PhyT2V: LLM-Guided Iterative Self-Refinement for Physics-Grounded Text-to-Video
    Generation](/publication/2024-phyt2v/), is now available on ArXiv.

- date: '2024-09'
  text: >-
    Our paper, [Perceptual-Centric Image Super-Resolution using Heterogeneous Processors on
    Mobile Devices](/publication/2024-fye-sr/), has been accepted for publication at the 2024
    ACM International Conference on Mobile Computing and Networking (MobiCom'24).

- date: '2024-06'
  text: >-
    The preprint of our recent work on preventing illegal model adaptation, [FreezeAsGuard:
    Mitigating Illegal Adaptation of Diffusion Models via Selective Tensor
    Freezing](/publication/2024-freezeasguard/), and research on the sparsification of Small
    Language Models (SLMs), [Achieving Sparse Activation in Small Language
    Models](/publication/2026-sparse-activation-slm/), are now available on arXiv.

- date: '2024-01'
  text: >-
    We are happy to publish the dataset of human airway measurements, produced by our integrated
    AI and sensing systems for smart pulmonary telemedicine, namely [Acoustic Waveform
    Respiratory Evaluation (AWARE)](/dataset/#aware).

- date: '2024-01'
  text: >-
    Our paper, [Towards Green AI in Fine-Tuning Large Language Models via Adaptive
    Backpropagation](/publication/2023-greentrainer/), has been accepted for publication at the
    2024 International Conference on Learning Representations (ICLR).

- date: '2023-12'
  text: >-
    The preprint of our recent work on runtime modality adaptation for embodied AI, [Modality
    Plug-and-Play: Elastic Modality Adaptation in Multimodal LLMs for Embodied
    AI](/publication/2023-mpnp-llm/), has been made publicly available [on
    arXiv](https://arxiv.org/abs/2312.07886).

- date: '2023-09'
  text: >-
    Two of our recent works, [Towards Green AI in Fine-tuning Large Language Models via Adaptive
    Backpropagation](/publication/2023-greentrainer/) (“GreenTrainer”) and [Tackling the
    Unlimited Staleness in Federated Learning with Intertwined Data and Device
    Heterogeneities](/publication/2023-intertwined-heterogeneity/), are now available online on
    arXiv.

- date: '2023-06'
  text: >-
    Two papers from our lab, [ElasticTrainer: Speeding Up On-Device Training with Runtime
    Elastic Tensor Selection](/publication/2023-elastictrainer/) and [PTEase: Objective Airway
    Examination for Pulmonary Telemedicine using Commodity
    Smartphones](/publication/2023-ptease/), are accepted and presented at MobiSys 2023.

- date: '2022-11'
  text: >-
    [AiFi: AI-Enabled WiFi Interference Cancellation with Commodity PHY-Layer
    Information](/publication/2022-aifi/) is accepted and presented at SenSys 2022.

- date: '2022-10'
  text: >-
    Our AgileNN work is accepted and presented at MobiCom 2022. The published paper, [Real-time
    Neural Network Inference on Extremely Weak Devices: Agile Offloading with Explainable
    AI](/publication/2022-agilenn/), is also available online.
