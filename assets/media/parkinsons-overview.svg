<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ol { stroke: #2b3a55; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .sym { font-size: 21px; font-style: italic; }
      .title { font-size: 38px; font-weight: bold; }
      .sub { font-size: 26px; fill: #34495e; }
      .conn { stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pill { fill: #f3f5f9; stroke: #2b3a55; stroke-width: 3; }
      .pill-text { font-size: 27px; fill: #2b3a55; font-weight: bold; }
      .tag { font-size: 24px; fill: #2b3a55; }
      /* card colours: airway teal, gaze purple, gait orange, muscle rose */
      .c-air  { fill: #e4f4f0; stroke: #8fd0bf; }  .t-air  { fill: #0f6b57; }  .s-air  { stroke: #1f8f76; }
      .c-gaze { fill: #efe9f8; stroke: #c4b1e4; }  .t-gaze { fill: #4b3186; }  .s-gaze { stroke: #6f4bb5; }
      .c-gait { fill: #fdf0e3; stroke: #f2c79c; }  .t-gait { fill: #9a4a12; }  .s-gait { stroke: #d9752b; }
      .c-musc { fill: #fbe8ed; stroke: #f0b0c0; }  .t-musc { fill: #8f2340; }  .s-musc { stroke: #c9405f; }
      .card { stroke-width: 3; }
      .ill { stroke-width: 5; fill: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
      .ill-line { stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- light backdrop so the figure also reads on a dark page background -->
  <rect x="0" y="0" width="1600" height="1120" rx="40" fill="#fbfcfe"/>

  <!-- ===== person: an older adult with a stooped posture, short steps, a cane and a resting tremor ===== -->
  <g id="person" transform="matrix(0.93 0 0 0.93 -40 70)">
    <!-- far arm, upper part (behind the torso) -->
    <polyline class="ol" points="900,395 858,510" stroke-width="44"/>
    <polyline points="900,395 858,510" stroke="#8fa3bf" stroke-width="32" stroke-linecap="round" fill="none"/>
    <!-- far leg -->
    <polyline class="ol" points="790,655 768,795 760,935" stroke-width="50"/>
    <polyline points="790,655 768,795 760,935" stroke="#4d5563" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path class="ol" d="M735,930 h60 a22,22 0 0 1 22,22 v10 h-96 v-10 a22,22 0 0 1 14,-22 z" fill="#2f343c"/>
    <!-- near leg -->
    <polyline class="ol" points="818,655 846,792 856,935" stroke-width="50"/>
    <polyline points="818,655 846,792 856,935" stroke="#5c6470" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path class="ol" d="M830,930 h64 a22,22 0 0 1 22,22 v10 h-100 v-10 a22,22 0 0 1 14,-22 z" fill="#3a3f47"/>
    <!-- trousers, hip -->
    <path class="ol" d="M754,634 h106 q16,0 14,18 l-6,30 h-122 l-6,-30 q-2,-18 14,-18 z" fill="#5c6470"/>
    <!-- torso: leaning forward with a rounded upper back -->
    <path class="ol" d="M752,640 C 728,540 770,400 890,352 L 950,368 C 948,450 905,560 862,640 Z" fill="#8fa3bf"/>
    <!-- shirt collar -->
    <path class="ol" d="M912,358 l30,-10 l12,26 l-24,12 z" fill="#f7f7f5"/>
    <!-- neck -->
    <path class="ol" d="M918,368 l32,-38 l30,26 l-30,36 z" fill="#f2c9a7"/>
    <!-- head, carried forward of the shoulders -->
    <circle class="ol" cx="985" cy="300" r="56" fill="#f2c9a7"/>
    <path class="ol" d="M1036,290 l14,18 l-12,8" fill="#f2c9a7"/>
    <circle cx="1018" cy="288" r="5" fill="#2b3a55"/>
    <path d="M1004,272 q14,-6 26,0" stroke="#2b3a55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M1030,322 q-8,4 -16,0" stroke="#2b3a55" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- grey hair -->
    <path class="ol" d="M930,306 a56,56 0 0 1 84,-60 q22,-4 30,12 q-34,0 -50,22 q-18,10 -28,30 q-6,20 -36,-4 z" fill="#d3d6da"/>
    <circle class="ol" cx="962" cy="308" r="9" fill="#f2c9a7"/>
    <!-- far forearm and hand in front of the chest, resting tremor -->
    <polyline class="ol" points="858,510 892,588" stroke-width="44"/>
    <polyline points="858,510 892,588" stroke="#8fa3bf" stroke-width="32" stroke-linecap="round" fill="none"/>
    <circle class="ol" cx="904" cy="602" r="20" fill="#f2c9a7"/>
    <g stroke="#2b3a55" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M938,578 a36,36 0 0 1 0,52"/>
      <path d="M954,566 a56,56 0 0 1 0,80"/>
    </g>
    <!-- near arm holding the cane -->
    <polyline class="ol" points="935,400 990,490 1005,568" stroke-width="44"/>
    <polyline points="935,400 990,490 1005,568" stroke="#8fa3bf" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- cane -->
    <path class="ol" d="M985,578 h48 a14,14 0 0 1 14,14 l24,359" stroke="#8b5a2b" stroke-width="14" fill="none"/>
    <path d="M985,578 h48 a14,14 0 0 1 14,14 l24,359" stroke="#a86e3b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="1071" cy="953" r="11" fill="#2b3a55"/>
    <circle class="ol" cx="1006" cy="578" r="20" fill="#f2c9a7"/>
  </g>

  <!-- ===== body markers and connectors, coloured like their cards ===== -->
  <g id="connectors">
    <!-- airway card -> thorax -->
    <line class="conn s-air" x1="620" y1="300" x2="690" y2="430"/>
    <circle cx="690" cy="430" r="22" fill="#1f8f76" opacity="0.18"/>
    <circle cx="690" cy="430" r="9" fill="#1f8f76"/>
    <!-- gaze: dashed ray from the eye to the gaze card -->
    <line x1="922" y1="330" x2="980" y2="262" stroke="#6f4bb5" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/>
    <!-- gait card -> knee -->
    <line class="conn s-gait" x1="620" y1="850" x2="674" y2="809"/>
    <circle cx="674" cy="809" r="22" fill="#d9752b" opacity="0.18"/>
    <circle cx="674" cy="809" r="9" fill="#d9752b"/>
    <!-- muscle card -> upper arm, routed above the cane -->
    <polyline class="conn s-musc" points="1080,720 1080,484 858,484"/>
    <circle cx="858" cy="484" r="22" fill="#c9405f" opacity="0.18"/>
    <circle cx="858" cy="484" r="9" fill="#c9405f"/>
  </g>

  <!-- posture tag -->
  <g id="posture-tag">
    <line class="conn" x1="600" y1="545" x2="652" y2="545" stroke="#2b3a55"/>
    <rect class="pill" x="392" y="522" width="208" height="46" rx="23"/>
    <text class="tag" x="496" y="554" text-anchor="middle">Stooped posture</text>
  </g>

  <!-- ===== cards ===== -->
  <!-- top-left: airway and lung function -->
  <g id="card-airway" transform="translate(20 110)">
    <rect class="card c-air" x="0" y="0" width="600" height="260" rx="24"/>
    <!-- lungs with trachea -->
    <g class="s-air">
      <rect class="ill" x="116" y="58" width="16" height="72" rx="7"/>
      <path class="ill-line" d="M124,130 l-16,20 M124,130 l16,20"/>
      <path class="ill" d="M108,128 C 62,126 36,176 42,220 C 46,242 74,246 94,236 L 110,226 Z" fill="#c2e8dd"/>
      <path class="ill" d="M140,128 C 186,126 212,176 206,220 C 202,242 174,246 154,236 L 138,226 Z" fill="#c2e8dd"/>
      <!-- smartphone probing the airway -->
      <rect class="ill" x="30" y="30" width="44" height="78" rx="8"/>
      <line class="ill-line" x1="44" y1="40" x2="60" y2="40"/>
      <path class="ill-line" d="M86,58 a18,18 0 0 1 0,28"/>
      <path class="ill-line" d="M98,46 a34,34 0 0 1 0,52"/>
    </g>
    <text class="sym t-air" x="235" y="52">Symptom: respiratory dysfunction</text>
    <text class="title t-air" x="235" y="100">Airway &amp; lung</text>
    <text class="title t-air" x="235" y="144">function exams</text>
    <text class="sub" x="235" y="192">At-home airway and lung</text>
    <text class="sub" x="235" y="226">exams with a smartphone.</text>
  </g>

  <!-- top-right: gaze-guided assistive robots -->
  <g id="card-gaze" transform="translate(980 110)">
    <rect class="card c-gaze" x="0" y="0" width="600" height="260" rx="24"/>
    <g class="s-gaze">
      <!-- wheelchair user with eye-tracking glasses, looking at a cup held by a robot arm -->
      <circle class="ill" cx="70" cy="200" r="30"/>
      <circle class="ill" cx="70" cy="200" r="8"/>
      <circle class="ill" cx="130" cy="216" r="10"/>
      <path class="ill-line" d="M44,92 L52,160 L114,160 L128,204"/>
      <path class="ill" d="M60,92 h28 a12,12 0 0 1 12,12 v54 h-46 v-54 a12,12 0 0 1 6,-12 z" fill="#d9cdef"/>
      <path class="ill" d="M56,150 h56 a12,12 0 0 1 12,12 v8 h-68 z" fill="#d9cdef"/>
      <line class="ill-line" x1="118" y1="170" x2="120" y2="204" stroke-width="14"/>
      <path class="ill" d="M108,204 h26 a8,8 0 0 1 8,8 v4 h-34 z" fill="#2b3a55" stroke="#2b3a55"/>
      <line class="ill-line" x1="74" y1="112" x2="104" y2="148" stroke-width="14"/>
      <circle class="ill" cx="78" cy="62" r="21" fill="#f2c9a7"/>
      <circle class="ill-line" cx="90" cy="66" r="9"/>
      <line class="ill-line" x1="81" y1="64" x2="62" y2="60"/>
      <line x1="100" y1="66" x2="164" y2="98" stroke="#6f4bb5" stroke-width="4" stroke-dasharray="8 7"/>
      <!-- robot arm holding a cup -->
      <rect class="ill" x="150" y="212" width="60" height="16" rx="6"/>
      <polyline class="ill-line" points="180,212 180,160 168,126"/>
      <circle class="ill" cx="180" cy="160" r="9"/>
      <circle class="ill" cx="168" cy="126" r="8"/>
      <path class="ill-line" d="M160,118 l-6,-10 M176,118 l6,-10"/>
      <rect class="ill" x="156" y="86" width="24" height="30" rx="4" fill="#d9cdef"/>
      <path class="ill-line" d="M180,94 a8,8 0 0 1 0,16"/>
    </g>
    <text class="sym t-gaze" x="235" y="52">Symptom: severe motor impairment</text>
    <text class="title t-gaze" x="235" y="100">Gaze-guided</text>
    <text class="title t-gaze" x="235" y="144">assistive robots</text>
    <text class="sub" x="235" y="192">Robots steered by eye gaze,</text>
    <text class="sub" x="235" y="226">tuned by natural language.</text>
  </g>

  <!-- bottom-left: interpretable gait analysis -->
  <g id="card-gait" transform="translate(20 720)">
    <rect class="card c-gait" x="0" y="0" width="600" height="260" rx="24"/>
    <g class="s-gait">
      <!-- video frame corners -->
      <path class="ill-line" d="M30,60 v-30 h30 M190,30 h30 v30 M30,200 v30 h30 M220,200 v30 h-30"/>
      <!-- camera -->
      <rect class="ill" x="164" y="42" width="40" height="26" rx="5"/>
      <circle class="ill" cx="184" cy="55" r="7"/>
      <!-- walking figure as a pose skeleton -->
      <circle class="ill" cx="122" cy="62" r="17" fill="#f7dcc2"/>
      <polyline class="ill-line" points="122,80 118,148"/>
      <polyline class="ill-line" points="122,90 148,120 138,150"/>
      <polyline class="ill-line" points="122,90 98,118 108,148"/>
      <polyline class="ill-line" points="118,148 146,182 150,222"/>
      <polyline class="ill-line" points="118,148 96,186 84,222"/>
      <!-- knee angle: the measured evidence -->
      <path class="ill-line" d="M134,168 a18,18 0 0 1 12,26" stroke-dasharray="4 4"/>
      <g fill="#d9752b" stroke="none">
        <circle cx="122" cy="90" r="6"/><circle cx="118" cy="148" r="6"/>
        <circle cx="148" cy="120" r="6"/><circle cx="98" cy="118" r="6"/>
        <circle cx="138" cy="150" r="6"/><circle cx="108" cy="148" r="6"/>
        <circle cx="146" cy="182" r="6"/><circle cx="96" cy="186" r="6"/>
        <circle cx="150" cy="222" r="6"/><circle cx="84" cy="222" r="6"/>
      </g>
      <text x="160" y="176" font-size="22px" font-style="italic" fill="#9a4a12">&#x3b8;</text>
    </g>
    <text class="sym t-gait" x="235" y="52">Symptom: shuffling gait</text>
    <text class="title t-gait" x="235" y="100">Interpretable</text>
    <text class="title t-gait" x="235" y="144">gait analysis</text>
    <text class="sub" x="235" y="192">Video gait analysis backed</text>
    <text class="sub" x="235" y="226">by biomechanical evidence.</text>
  </g>

  <!-- bottom-right: muscle fatigue monitoring -->
  <g id="card-muscle" transform="translate(980 720)">
    <rect class="card c-musc" x="0" y="0" width="600" height="260" rx="24"/>
    <g class="s-musc">
      <!-- flexed arm with the biceps highlighted -->
      <polyline points="56,70 84,178 168,136" stroke="#2b3a55" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polyline points="56,70 84,178 168,136" stroke="#f2c9a7" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <ellipse cx="76" cy="122" rx="15" ry="36" transform="rotate(-14 76 122)" fill="#c9405f" opacity="0.75"/>
      <circle class="ill" cx="172" cy="134" r="19" fill="#f2c9a7" stroke="#2b3a55"/>
      <!-- smartphone sending sonar pulses at the muscle -->
      <rect class="ill" x="156" y="18" width="44" height="76" rx="8"/>
      <line class="ill-line" x1="170" y1="28" x2="186" y2="28"/>
      <path class="ill-line" d="M142,44 a20,20 0 0 0 0,30"/>
      <path class="ill-line" d="M128,32 a36,36 0 0 0 0,54"/>
      <!-- fatigue waveform -->
      <polyline class="ill-line" points="34,222 70,222 80,206 92,240 104,204 116,238 128,210 138,222 214,222"/>
    </g>
    <text class="sym t-musc" x="235" y="52">Symptom: fatigue &amp; weakness</text>
    <text class="title t-musc" x="235" y="100">Muscle fatigue</text>
    <text class="title t-musc" x="235" y="144">monitoring</text>
    <text class="sub" x="235" y="192">Phone sonar tracks muscle</text>
    <text class="sub" x="235" y="226">fatigue in daily exercise.</text>
  </g>

  <!-- ===== method pills ===== -->
  <g id="pills">
    <rect class="pill" x="230" y="1030" width="240" height="56" rx="28"/>
    <text class="pill-text" x="350" y="1068" text-anchor="middle">Generative AI</text>
    <rect class="pill" x="500" y="1030" width="270" height="56" rx="28"/>
    <text class="pill-text" x="635" y="1068" text-anchor="middle">Computer vision</text>
    <rect class="pill" x="800" y="1030" width="250" height="56" rx="28"/>
    <text class="pill-text" x="925" y="1068" text-anchor="middle">Mobile sensing</text>
    <rect class="pill" x="1080" y="1030" width="290" height="56" rx="28"/>
    <text class="pill-text" x="1225" y="1068" text-anchor="middle">Assistive robotics</text>
  </g>
</svg>
